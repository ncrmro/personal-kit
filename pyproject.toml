[project]
name = "persona-kit"
version = "0.1.0"
description = "Persona Kit - Create markdown-based personas for AI agents and review websites using Playwright MCP."
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "httpx[socks]",
    "platformdirs",
    "readchar",
    "truststore>=0.10.4",
    "pyyaml",
]

[project.scripts]
persona-kit = "persona_kit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persona_kit"]

